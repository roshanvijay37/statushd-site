    if (playing) { var p = vid.play(); if (p && p.catch) p.catch(function () {}); }
    if (user) track("howto_phone", {phone: which});
  }
  pickBtns.forEach(function (b) { b.addEventListener("click", function () { pick(b.getAttribute("data-v"), true); }); });
  pick(/iPhone|iPad|iPod/.test(navigator.userAgent) ? "iphone" : "android", false);
  // ---- the player: full screen with sound, our own controls (see the CSS note) ----
  var player = document.getElementById("player"), pv = document.getElementById("pvid");
  var pplay = document.getElementById("pplay"), pseek = document.getElementById("pseek");
  var ptime = document.getElementById("ptime"), pdur = document.getElementById("pdur");
  var pmute = document.getElementById("pmute"), pflash = document.getElementById("pflash");
  var ICON_PAUSE = pplay.innerHTML, ICON_SOUND = pmute.innerHTML;
  var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2z"/></svg>';
  var ICON_AGAIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 3.5v4h4"/></svg>';
  var ICON_MUTED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z" fill="currentColor"/><path d="m16 9.5 5 5m0-5-5 5"/></svg>';
  var hideT = null, seeking = false;
  function fmt(t) { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ":" + ("0" + t % 60).slice(-2); }
  function showCtl() {
    player.classList.remove("idle"); clearTimeout(hideT);
    if (!pv.paused) hideT = setTimeout(function () { player.classList.add("idle"); }, 2600);
  }
  function icons() {
    pplay.innerHTML = pv.ended ? ICON_AGAIN : pv.paused ? ICON_PLAY : ICON_PAUSE;
    pplay.setAttribute("aria-label", pv.ended ? "Play again" : pv.paused ? "Play" : "Pause");
    pmute.innerHTML = pv.muted ? ICON_MUTED : ICON_SOUND;
    pmute.setAttribute("aria-label", pv.muted ? "Sound on" : "Sound off");
  }
  function play() { var p = pv.play(); if (p && p.catch) p.catch(function () { icons(); showCtl(); }); }
  function toggle() { if (pv.paused || pv.ended) { if (pv.ended) pv.currentTime = 0; play(); } else pv.pause(); showCtl(); }
  function skip(d) {
    if (!pv.duration) return;
    pv.currentTime = Math.max(0, Math.min(pv.duration - 0.2, pv.currentTime + d));
    pflash.textContent = (d < 0 ? "\u2212" : "+") + Math.abs(d) + "s";
    pflash.className = "pflash " + (d < 0 ? "l" : "r"); void pflash.offsetWidth; pflash.classList.add("go");
    showCtl();
  }
  function openPlayer() {
    track("howto_fullscreen");
    var src = vid.getAttribute("src");
    if (pv.getAttribute("src") !== src) { pv.src = src; pv.poster = vid.poster; }
    pv.currentTime = 0; pv.muted = false; zoomReset();
    player.hidden = false; document.body.style.overflow = "hidden"; vid.pause();
    try { if (player.requestFullscreen) player.requestFullscreen().catch(function () {}); } catch (e) {}
    try { history.pushState({player: 1}, ""); } catch (e) {}
    play(); icons(); showCtl();
    document.getElementById("pclose").focus({preventScroll: true});
  }
  function closePlayer(fromBack) {
    if (player.hidden) return;
    pv.pause(); player.hidden = true; document.body.style.overflow = ""; clearTimeout(hideT); zoomReset();
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
    if (!fromBack && history.state && history.state.player) history.back();
    if (!reduce) { var p = vid.play(); if (p && p.catch) p.catch(function () {}); }
  }
  document.getElementById("howfs").addEventListener("click", openPlayer);
  vid.addEventListener("click", openPlayer);
  document.getElementById("pclose").addEventListener("click", function () { closePlayer(false); });
  document.getElementById("pback").addEventListener("click", function () { skip(-5); });
  document.getElementById("pfwd").addEventListener("click", function () { skip(5); });
  pplay.addEventListener("click", toggle);
  pmute.addEventListener("click", function () { pv.muted = !pv.muted; icons(); showCtl(); });
  addEventListener("popstate", function () { closePlayer(true); });          // the phone's Back
  document.addEventListener("fullscreenchange", function () { if (!document.fullscreenElement) closePlayer(false); });
  // ---- pinch to zoom (up to 4x), drag to look around while zoomed; Reset zoom or a double tap undoes it ----
  var zs = 1, zx = 0, zy = 0, gesture = null, pzoom = document.getElementById("pzoom");
  function zoomApply() {
    var w = player.clientWidth, h = player.clientHeight;
    var mx = (zs - 1) * w / 2, my = (zs - 1) * h / 2;          // never pull an edge into view
    zx = Math.max(-mx, Math.min(mx, zx)); zy = Math.max(-my, Math.min(my, zy));
    pv.style.transform = zs > 1 ? "translate(" + zx + "px," + zy + "px) scale(" + zs + ")" : "";
    pzoom.hidden = zs <= 1;
  }
  function zoomReset() { zs = 1; zx = 0; zy = 0; zoomApply(); }
  function dist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  function mid(t) { return {x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2}; }
  pzoom.addEventListener("click", function () { zoomReset(); showCtl(); });
  player.addEventListener("touchstart", function (e) {
    if (e.target.closest("button, input")) return;
    var t = e.touches;
    if (t.length === 2) {
      var m = mid(t), r = player.getBoundingClientRect();
      gesture = {kind: "pinch", d0: dist(t), s0: zs, cx: r.left + r.width / 2, cy: r.top + r.height / 2,
                 px: (m.x - r.left - r.width / 2 - zx) / zs, py: (m.y - r.top - r.height / 2 - zy) / zs};
    } else if (t.length === 1 && zs > 1) {
      gesture = {kind: "pan", x0: t[0].clientX, y0: t[0].clientY, zx0: zx, zy0: zy};
    }
  }, {passive: true});
  player.addEventListener("touchmove", function (e) {
    if (!gesture) return;
    var t = e.touches;
    if (gesture.kind === "pinch" && t.length === 2) {
      var m = mid(t);
      zs = Math.max(1, Math.min(4, gesture.s0 * dist(t) / gesture.d0));
      zx = m.x - gesture.cx - zs * gesture.px; zy = m.y - gesture.cy - zs * gesture.py;   // the point under the fingers stays there
      zoomApply(); e.preventDefault();
    } else if (gesture.kind === "pan" && t.length === 1) {
      zx = gesture.zx0 + t[0].clientX - gesture.x0; zy = gesture.zy0 + t[0].clientY - gesture.y0;
      zoomApply(); e.preventDefault();
    }
  }, {passive: false});
  player.addEventListener("touchend", function (e) {
    if (e.touches.length === 0) { gesture = null; if (zs < 1.05) zoomReset(); }
    else if (e.touches.length === 1 && zs > 1) gesture = {kind: "pan", x0: e.touches[0].clientX, y0: e.touches[0].clientY, zx0: zx, zy0: zy};
  });

  // a tap shows or hides the controls; a double tap on the left or right jumps 5 s, in the middle plays/pauses
  // (zoomed in, a double tap goes back to normal size instead)
  var lastTap = 0, tapT = null;
  player.addEventListener("click", function (e) {
    if (e.target.closest("button, input")) return;
    var now = Date.now(), x = e.clientX / innerWidth;
    if (now - lastTap < 320) {
      clearTimeout(tapT); lastTap = 0;
      if (zs > 1) zoomReset(); else if (x < .4) skip(-5); else if (x > .6) skip(5); else toggle();
      return;
    }
    lastTap = now;
    tapT = setTimeout(function () {
      if (player.classList.contains("idle") || pv.paused) showCtl(); else player.classList.add("idle");
    }, 320);
  });
  player.addEventListener("mousemove", showCtl);
  pv.addEventListener("play", function () { icons(); showCtl(); });
  pv.addEventListener("pause", function () { icons(); showCtl(); });
  pv.addEventListener("ended", function () { icons(); showCtl(); });
  pv.addEventListener("loadedmetadata", function () { pdur.textContent = fmt(pv.duration); });
  pv.addEventListener("timeupdate", function () {
    if (seeking || !pv.duration) return;
    pseek.value = Math.round(pv.currentTime / pv.duration * 1000); ptime.textContent = fmt(pv.currentTime);
  });
  pseek.addEventListener("input", function () {
    seeking = true;
    if (pv.duration) { pv.currentTime = pseek.value / 1000 * pv.duration; ptime.textContent = fmt(pv.currentTime); }
    showCtl();
  });
  pseek.addEventListener("change", function () { seeking = false; });
  addEventListener("keydown", function (e) {
    if (player.hidden) return;
    var k = e.key;
    if (k === "Escape") closePlayer(false);
    else if (k === " " || k === "k") toggle();
    else if (k === "ArrowLeft") skip(-5);
    else if (k === "ArrowRight") skip(5);
    else if (k === "m") { pv.muted = !pv.muted; icons(); showCtl(); }
    else return;
    e.preventDefault();
  });

  // the small video on the page plays by itself, silently, while it is on screen
  if (!reduce && "IntersectionObserver" in window) {
    new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (e.isIntersecting && player.hidden) { var p = vid.play(); if (p && p.catch) p.catch(function () {}); }
        else vid.pause();
      });
    }, {threshold: .35}).observe(vid);
  }

  // ---- things arrive as you reach them ----
  if ("IntersectionObserver" in window && !reduce) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }); }, {threshold: .12});
    document.querySelectorAll(".rv").forEach(function (el) { io.observe(el); });
  } else document.querySelectorAll(".rv").forEach(function (el) { el.classList.add("in"); });
})();
</script>
</body>
</html>
